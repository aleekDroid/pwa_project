<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3f51b5">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/src/images/icon-192.png">
  <title>UTEQGram</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
  <link rel="stylesheet" href="src/css/app.css">
  <link rel="stylesheet" href="src/css/feed.css">
  <link rel="stylesheet" href="src/css/help.css">
</head>
<style>
  body {
    font-family: Roboto, sans-serif;
  }

  h1 {
    color: blue;
    text-align: center;
  }

  .description {
    text-align: center;
  }

  .button {
    border-radius: 12px !important;
    transition: background-color 0.3s ease !important;
  }

  .button-hover {
    background-color: rgb(230, 173, 213) !important;
  }

  .span {
    border-radius: 12px;
  }
</style>

<body>

  <div id="app">
    <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
      <header class="mdl-layout__header">
        <div class="mdl-layout__header-row">
          <!-- Title -->
          <span class="mdl-layout-title">UTEQGram</span>
          <!-- Add spacer, to align navigation to the right -->
          <div class="mdl-layout-spacer"></div>
          <!-- Navigation. We hide it in small screens. -->
          <nav class="mdl-navigation mdl-layout--large-screen-only">
            <a class="mdl-navigation__link" href="./index.html">Feed</a>
            <a class="mdl-navigation__link" href="help/index.html">Help</a>
            <div class="drawer-option">
              <button class="enable-notifications mdl-button mdl-js-button 
            mdl-button--raised mdl-button--colored mdl-color--accent" style="border-radius: 12px;">
                Habilitar Notificaciones
              </button>
            </div>
          </nav>
        </div>
      </header>
      <div class="mdl-layout__drawer">
        <span class="mdl-layout-title">UTEQGram</span>
        <nav class="mdl-navigation">
          <a class="mdl-navigation__link" href="./index.html">Feed</a>
          <a class="mdl-navigation__link" href="help/index.html">Help</a>
          <div class="drawer-option">
            <button class="enable-notifications mdl-button mdl-js-button 
          mdl-button--raised mdl-button--colored mdl-color--accent" style="border-radius: 12px;">
              Habilitar Notificaciones
            </button>
          </div>
        </nav>
      </div>
      <main class="mdl-layout__content mat-typography">
        <div id="create-post">
          <form>
            <div class="input-section mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
              <input class="mdl-textfield__input" type="text" id="title">
              <label class="mdl-textfield__label" for="title" name="title">Title</label>
            </div>
            <div class="input-section mdl-textfield mdl-js-textfield mdl-textfield--floating-label"
              id="manual-location">
              <input class="mdl-textfield__input" type="text" id="location">
              <label class="mdl-textfield__label" for="location" name="location">Location</label>
            </div>
            <div class="input-section" style="margin: 15px 0;">
              <label for="filePicker" style="font-weight: bold; color: #3f51b5;">Seleccionar Imagen:</label><br>
              <input type="file" id="filePicker" accept="image/*" style="margin-top: 8px;">
            </div>
            <br>
            <div>
              <button class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent"
                type="submit" id="post-btn">Postear!
              </button>
            </div>
            <br>
            <div>
              <button class="mdl-button mdl-js-button mdl-button--fab" id="close-create-post-modal-btn" type="button">
                <i class="material-icons">close</i>
              </button>
            </div>
          </form>
        </div>
        <img src="src/images/main-image-lg.png" alt="Explore the City" class="main-image">
        <div class="page-content">
          <h5 class="text-center mdl-color-text--primary">Comparte tus Momentos</h5>
          <div id="shared-moments"></div>
        </div>
        <div class="floating-button">
          <button class="mdl-button mdl-js-button mdl-button--fab mdl-button--colored" id="share-image-button">
            <i class="material-icons">add</i>
          </button>
        </div>
        <div id="confirmation-toast" aria-live="assertive" aria-atomic="true" aria-relevant="text"
          class="mdl-snackbar mdl-js-snackbar">
          <div class="mdl-snackbar__text"></div>
          <button type="button" class="mdl-snackbar__action"></button>
        </div>
      </main>
    </div>
  </div>
  <script defer src="src/js/material.min.js"></script>
  <script src="src/js/idb.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="src/js/utility.js"></script>
  <script src="src/js/app.js"></script>
  <script src="src/js/feed.js"></script>
</body>

</html>
